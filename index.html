<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102b46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Repair Hero — スマホ修理商店街</title>
  <meta name="description" content="フェニちゃんがスマホ修理商店街を駆け抜ける2D横スクロールアクションゲーム">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Repair Hero ゲーム画面"></canvas>

    <header id="hud" class="hud hidden" aria-label="ゲーム情報">
      <div class="hp"><span>HP</span><b id="hearts">♥ ♥ ♥</b></div>
      <div><span>COIN</span><b>● <i id="coins">00</i></b></div>
      <div><span>SCORE</span><b id="score">000000</b></div>
      <div><span>TIME</span><b id="timer">120</b></div>
      <div class="dash-meter"><span>DASH</span><meter id="dashGauge" min="0" max="100" value="100">100%</meter></div>
      <div id="modeHud" class="mode-hud hidden"><span>RANDOM TRANSFORM</span><b id="modeTimer">NORMAL</b></div>
    </header>
    <aside id="bossHud" class="boss-hud hidden" aria-live="polite"><span>BOSS</span><b>MEGA BUG TITAN</b><div><i id="bossHp"></i></div><em id="goalLock">GOAL LOCKED</em></aside>

    <section id="title" class="screen title">
      <div class="title-badge">STAGES 1-1 — 1-5</div>
      <h1><span>REPAIR</span><strong>HERO</strong></h1>
      <p>スマホ修理商店街を救え！</p>
      <div class="title-feni"><img src="./feni.png" alt="主人公 フェニちゃん"><span>フェニちゃん</span></div>
      <button id="start">ゲームスタート <small>SPACE / ENTER</small></button>
      <p class="help">地下・海・空を突破して大型ボスを修理せよ！</p>
    </section>

    <section id="result" class="screen result hidden">
      <div>
        <p id="resultKicker">STAGE CLEAR!</p>
        <img class="result-feni" src="./feni.png" alt="主人公 フェニちゃん">
        <h2 id="resultTitle">修理完了！</h2>
        <p id="resultStats"></p>
        <button id="next">NEXT</button>
        <button id="retry" class="secondary">RETRY</button>
      </div>
    </section>

    <div id="notice" class="notice" aria-live="polite"></div>
    <div id="transformFlash" class="transform-flash" aria-hidden="true"></div>
    <button id="pause" class="pause hidden" aria-label="一時停止">Ⅱ</button>

    <nav id="touch" class="touch hidden" aria-label="タッチ操作">
      <div class="move-pad">
        <button data-input="dashLeft" class="dash" aria-label="左へダッシュ">DASH ←</button>
        <button data-input="dashRight" class="dash" aria-label="右へダッシュ">DASH →</button>
        <button data-input="left" aria-label="左へ移動">←</button>
        <button data-input="right" aria-label="右へ移動">→</button>
      </div>
      <div class="action-pad">
        <button id="attack" data-input="attack" class="attack hidden">⚔<br>ATTACK</button>
        <button data-input="jump" class="jump">JUMP</button>
      </div>
    </nav>
  </main>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
